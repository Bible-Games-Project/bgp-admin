# Base config for the Cloudflare preview deploy (.github/workflows/cloudflare-preview.yml).
# Nitro's cloudflare-module preset merges this with the config it generates at
# .output/server/wrangler.json (main entry, assets dir, compatibility flags) on `bun run build`.
# See https://nitro.build/deploy/providers/cloudflare
#
# TOML (not JSON/JSONC) on purpose: `wrangler secret bulk` (run by
# cloudflare/wrangler-action before the actual deploy) reads config from this
# repo root with no --config override, and the pinned wrangler version it
# installs (3.90.0) only auto-discovers wrangler.toml, not .jsonc.
name = "bgp-admin-preview"

# Non-secret server-side config the app reads via process.env (see
# src/integrations/supabase/client.ts and auth-middleware.ts). Same values
# already committed in .env (VITE_SUPABASE_*) — the anon/publishable key is
# designed to be public. SUPABASE_SERVICE_ROLE_KEY and GITHUB_PAT are NOT
# here: they're real secrets, pushed as Worker secrets from GitHub Actions
# secrets in cloudflare-preview.yml instead.
[vars]
