name: "[Reusable] Notify Telegram"

on:
  workflow_call:
    inputs:
      app-name:
        description: "Display name of the app for the notification"
        required: true
        type: string
      platforms:
        description: "Platforms deployed (e.g., 'iOS + Android')"
        required: false
        type: string
        default: "iOS + Android"
      ios-result:
        description: "Result of the iOS job (success/failure/skipped)"
        required: false
        type: string
      android-result:
        description: "Android job result (success/failure/skipped)"
        required: false
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

jobs:
  notify:
    name: Send Telegram Notification 🎉
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version with build number
        id: get_version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PARTS=(${BASE_VERSION//./ })
          VERSION="${PARTS[0]}.${PARTS[1]}.${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # bgp-admin rewrites capacitor.config.ts on every rename, so the name read from it
      # is current. The app-name input is only a fallback: it was frozen into each repo's
      # deploy.yml when that file was generated, and renames never touch it.
      - name: Resolve app name
        id: app_name
        env:
          FALLBACK_NAME: ${{ inputs.app-name }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let name = '';
          try {
            const config = fs.readFileSync('capacitor.config.ts', 'utf8');
            const m = config.match(/appName:\s*(['"])((?:\\.|(?!\1).)*)\1/);
            if (m) name = m[2].replace(/\\(.)/g, '$1');
          } catch {}
          name = (name || process.env.FALLBACK_NAME || '').trim();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\n`);
          console.log(`App name: ${name}`);
          EOF

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.get_version.outputs.version }}
          APP_NAME: ${{ steps.app_name.outputs.name }}
          PLATFORMS: ${{ inputs.platforms }}
          IOS_RESULT: ${{ inputs.ios-result }}
          ANDROID_RESULT: ${{ inputs.android-result }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # A run URL needs the owner/repo path: without it GitHub answers 404.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # A called workflow sees its caller's event, so the deploy panel's production
          # input is readable here without changing any repo's deploy.yml.
          PRODUCTION: ${{ github.event.inputs.production }}
          ACTOR: ${{ github.actor }}
        run: |
          # Telegram's HTML mode rejects the whole message on a stray <, > or &. sed, not
          # ${s//…}: bash 5.2 turns & in a replacement into the matched text.
          esc() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          # Status line per platform, spoken plainly
          say() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *)       echo "➖" ;;  # cancelled or unknown
            esac
          }

          # Only the platforms that were part of this run: a repo that ships to one store
          # skips the other job, and listing it would read as if it had been attempted.
          PLATFORMS_LINE=""
          add_platform() {
            case "$2" in
              ""|skipped) return 0 ;;
            esac
            PLATFORMS_LINE+="$(say "$2") $1   "
          }
          add_platform iOS "${IOS_RESULT}"
          add_platform Android "${ANDROID_RESULT}"
          PLATFORMS_LINE="${PLATFORMS_LINE%   }"
          # Callers from before the per-store results only pass the platforms label
          if [ -z "${PLATFORMS_LINE}" ]; then
            PLATFORMS_LINE="${PLATFORMS}"
          fi

          # Pick a headline that matches what actually happened
          if [ "${PRODUCTION}" = "true" ]; then
            KIND="Production release"
          else
            KIND="Beta"
          fi
          if [ "${IOS_RESULT}" = "failure" ] || [ "${ANDROID_RESULT}" = "failure" ]; then
            HEADLINE="⚠️ <b>${KIND} had a problem</b>"
          elif [ "${PRODUCTION}" = "true" ]; then
            HEADLINE="🚀 <b>Production release sent to the stores</b>"
          else
            HEADLINE="🚀 <b>Beta published successfully</b>"
          fi

          # Real newlines: --data-urlencode encodes the text as-is, so a URL-escaped
          # newline would reach Telegram as the literal characters, not a line break
          NL=$'\n'
          MESSAGE="${HEADLINE}${NL}${NL}"
          MESSAGE+="📱 <b>App:</b> $(esc "${APP_NAME}")${NL}"
          MESSAGE+="📦 <b>Version:</b> ${VERSION}${NL}"
          MESSAGE+="🖥️ <b>Platforms:</b> ${PLATFORMS_LINE}${NL}"
          MESSAGE+="🌿 <b>Repo:</b> <a href='${REPO_URL}'>${REPO_NAME}</a>${NL}"
          if [ -n "${PR_URL}" ]; then
            MESSAGE+="🔀 <b>Pull request:</b> <a href='${PR_URL}'>$(esc "${PR_TITLE}")</a>${NL}"
          fi
          MESSAGE+="🔎 <b>Details:</b> <a href='${RUN_URL}'>open the run on GitHub</a>${NL}"
          MESSAGE+="🧑🏻‍💻 <b>Published by:</b> ${ACTOR}"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode disable_web_page_preview=true \
            --data-urlencode text="${MESSAGE}" \
            --fail-with-body --output /dev/null
          echo "Sent Telegram notification."
