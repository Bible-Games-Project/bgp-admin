name: "[Reusable] Notify Telegram"

on:
  workflow_call:
    inputs:
      app-name:
        description: "Display name of the app for the notification"
        required: true
        type: string
      platforms:
        description: "Platforms deployed (e.g., 'iOS + Android')"
        required: false
        type: string
        default: "iOS + Android"
      ios-result:
        description: "Result of the iOS job (success/failure/skipped)"
        required: false
        type: string
      android-result:
        description: "Android job result (success/failure/skipped)"
        required: false
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true
      TELEGRAM_CHAT_ID:
        required: true

jobs:
  notify:
    name: Send Telegram Notification 🎉
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version with build number
        id: get_version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PARTS=(${BASE_VERSION//./ })
          VERSION="${PARTS[0]}.${PARTS[1]}.${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # bgp-admin rewrites capacitor.config.ts on every rename, so the name read from it
      # is current. The app-name input is only a fallback: it was frozen into each repo's
      # deploy.yml when that file was generated, and renames never touch it.
      - name: Resolve app name
        id: app_name
        env:
          FALLBACK_NAME: ${{ inputs.app-name }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let name = '';
          try {
            const config = fs.readFileSync('capacitor.config.ts', 'utf8');
            const m = config.match(/appName:\s*(['"])((?:\\.|(?!\1).)*)\1/);
            if (m) name = m[2].replace(/\\(.)/g, '$1');
          } catch {}
          name = (name || process.env.FALLBACK_NAME || '').trim();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\n`);
          console.log(`App name: ${name}`);
          EOF

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.get_version.outputs.version }}
          APP_NAME: ${{ steps.app_name.outputs.name }}
          PLATFORMS: ${{ inputs.platforms }}
          IOS_RESULT: ${{ inputs.ios-result }}
          ANDROID_RESULT: ${{ inputs.android-result }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/actions/runs/{1}', github.server_url, github.run_id) }}
          ACTOR: ${{ github.actor }}
        run: |
          # Status line per platform, spoken plainly
          say() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              *)       echo "➖" ;;  # cancelled or unknown
            esac
          }
          IOS_EMOJI=$(say "${IOS_RESULT}")
          AND_EMOJI=$(say "${ANDROID_RESULT}")

          # Pick a headline that matches what actually happened
          if [ "${IOS_RESULT}" = "failure" ] || [ "${ANDROID_RESULT}" = "failure" ]; then
            HEADLINE="⚠️ <b>Publish had a problem</b>"
          else
            HEADLINE="🚀 <b>Beta published successfully</b>"
          fi

          MESSAGE="${HEADLINE}%0A%0A"
          MESSAGE+="📱 <b>App:</b> ${APP_NAME}%0A"
          MESSAGE+="📦 <b>Version:</b> ${VERSION}%0A"
          MESSAGE+="🖥️ <b>Platforms:</b> ${IOS_EMOJI} iOS   ${AND_EMOJI} Android%0A"
          MESSAGE+="🌿 <b>Repo:</b> <a href='${REPO_URL}'>${REPO_NAME}</a>%0A"
          MESSAGE+="🔹 <b>Change:</b> <a href='${PR_URL}'>run details</a>%0A"
          MESSAGE+="🧑🏻‍💻 <b>Published by:</b> ${ACTOR}"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode disable_web_page_preview=true \
            --data-urlencode text="${MESSAGE}" \
            --fail-with-body --output /dev/null
          echo "Sent Telegram notification."
