name: "[Reusable] Deploy Android"

on:
  workflow_call:
    inputs:
      package-name:
        description: "Android package name (e.g., com.biblegames.eden)"
        required: true
        type: string
      play-track:
        description: "Google Play track (internal, alpha, beta, production). production skips the build entirely and promotes the release already sitting on the internal track instead — run a normal (internal) deploy first so there is one to promote"
        required: false
        type: string
        default: "internal"
      java-version:
        description: "Java version for Gradle"
        required: false
        type: string
        default: "21"
      version-code-offset:
        description: "Offset added to GITHUB_RUN_NUMBER for versionCode"
        required: false
        type: number
        default: 2
      pre-build-script:
        description: "Optional script to run before build"
        required: false
        type: string
        default: ""
      skip-upload:
        description: "Skip Google Play upload (only generate AAB artifact)"
        required: false
        type: boolean
        default: false
      marketing-version:
        description: "Marketing version (e.g., 1.0, 2.1). If empty, uses package.json"
        required: false
        type: string
        default: ""
      release-notes:
        description: "What's New for the Play Store release. If empty, Play keeps the notes from the previous release"
        required: false
        type: string
        default: ""
      release-notes-locale:
        description: "Play Store listing locale the release notes are written for (must already exist in the listing)"
        required: false
        type: string
        default: "en-US"
    secrets:
      ANDROID_KEYSTORE:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: true

jobs:
  deploy-android:
    name: Build & Deploy Android
    # "Deploy to Testing" (play-track=internal) builds fresh and uploads to the internal
    # track. "Release to Production" (play-track=production) never lands here — it skips
    # this whole build, and promotes the release the internal track already has via
    # promote-android-production below, so the artifact reviewed for production is
    # provably the one that was already tested. generate_aab_only (skip-upload) always
    # builds, even when play-track is production, since there is nothing to promote to.
    if: inputs.play-track != 'production' || inputs.skip-upload == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Patch package.json version with build number
        run: |
          set -euo pipefail
          FILE="package.json"

          if [ ! -f "$FILE" ]; then
            echo "❌ No existe $FILE"
            exit 1
          fi

          echo "🔍 Versión original:"
          grep '"version"' "$FILE"

          node - <<'EOF'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));

          const runNumber = process.env.GITHUB_RUN_NUMBER || '0';
          const parts = pkg.version.split('.');
          parts[parts.length - 1] = runNumber;
          pkg.version = parts.join('.');

          fs.writeFileSync(path, JSON.stringify(pkg, null, 2));
          console.log('✅ Nueva versión:', pkg.version);
          EOF

          echo "✅ Resultado final:"
          grep '"version"' "$FILE"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Run pre-build script
        if: inputs.pre-build-script != ''
        run: ${{ inputs.pre-build-script }}

      - name: Generate index.html for TanStack Start builds
        run: |
          if [ -f "scripts/generate-capacitor-html.js" ]; then
            CAPACITOR_BUILD=1 node scripts/generate-capacitor-html.js
          else
            echo "No postbuild script found — skipping (run Capacitor Setup in bgp-admin if this is a TanStack Start app)"
          fi

      - name: Inject safe area styles (notch / home indicator)
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const file = ['.output/public/index.html', 'dist/client/index.html', 'dist/index.html'].find((f) => fs.existsSync(f));
          if (!file) {
            console.log('No built index.html found — skipping safe area injection');
            process.exit(0);
          }
          let html = fs.readFileSync(file, 'utf8');
          if (html.includes('id="bgp-safe-area"')) {
            console.log('Safe area styles already present — skipping');
            process.exit(0);
          }

          // env(safe-area-inset-*) only reports real values when viewport-fit=cover is set
          const meta = html.match(/<meta[^>]*name=["']viewport["'][^>]*\/?>/i);
          if (meta) {
            let tag = meta[0];
            if (/viewport-fit/i.test(tag)) {
              tag = tag.replace(/viewport-fit=[\w-]*/i, 'viewport-fit=cover');
            } else {
              tag = tag.replace(/content=["']([^"']*)["']/i, (m, v) => `content="${v}, viewport-fit=cover"`);
            }
            html = html.replace(meta[0], tag);
          } else {
            html = html.replace(/<head[^>]*>/i, (m) =>
              `${m}\n  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />`);
          }

          const style = [
            '<style id="bgp-safe-area">',
            '  body {',
            '    padding-top: env(safe-area-inset-top, 0px);',
            '    padding-right: env(safe-area-inset-right, 0px);',
            '    padding-bottom: env(safe-area-inset-bottom, 0px);',
            '    padding-left: env(safe-area-inset-left, 0px);',
            '  }',
            '</style>',
          ].join('\n');
          html = html.replace('</head>', `${style}\n</head>`);

          fs.writeFileSync(file, html);
          console.log(`Injected safe area styles into ${file}`);
          EOF

      - name: Align capacitor.config webDir with the real build output
        run: |
          node - <<'EOF'
          const fs = require('fs');
          // @lovable.dev/vite-tanstack-config >= 2.7 moved the client build from
          // dist/client to .output/public. Repos set up before that still carry the
          // old webDir, so cap sync fails with "Could not find the web assets
          // directory". Trust the filesystem over the committed config.
          const actual = ['.output/public', 'dist/client', 'dist', 'build', 'out']
            .find((d) => fs.existsSync(`${d}/index.html`));
          if (!actual) {
            console.log('No built index.html found — leaving capacitor.config untouched');
            process.exit(0);
          }
          const file = ['capacitor.config.ts', 'capacitor.config.js', 'capacitor.config.json']
            .find((f) => fs.existsSync(f));
          if (!file) {
            console.log('No capacitor.config found — skipping');
            process.exit(0);
          }
          const src = fs.readFileSync(file, 'utf8');
          const current = src.match(/webDir\s*:\s*['"]([^'"]*)['"]/);
          if (current && current[1].replace(/^\.\/|\/$/g, '') === actual) {
            console.log(`webDir already points at ${actual}`);
            process.exit(0);
          }
          if (!current) {
            console.log(`Could not find a webDir entry in ${file} — skipping`);
            process.exit(0);
          }
          fs.writeFileSync(file, src.replace(current[0], `webDir: "${actual}"`));
          console.log(`Patched ${file}: webDir "${current[1]}" -> "${actual}" (CI checkout only)`);
          EOF

      - name: Sync Capacitor (Android)
        run: bunx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java-version }}

      - name: Decode and setup keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > android/app/release.keystore

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x ./gradlew

      - name: Setup Gradle
        run: |
          mkdir -p $HOME/.gradle
          cat > $HOME/.gradle/gradle.properties << EOF
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.configureondemand=false
          org.gradle.caching=false
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          EOF

      - name: Patch Android versionCode & versionName
        working-directory: android/app
        run: |
          VERSION_CODE=$(($GITHUB_RUN_NUMBER + ${{ inputs.version-code-offset }}))
          echo "Using versionCode: $VERSION_CODE"
          sed -i "s/versionCode .*/versionCode ${VERSION_CODE}/" build.gradle

          if [ -n "${{ inputs.marketing-version }}" ]; then
            BASE_VER="${{ inputs.marketing-version }}"
          else
            BASE_VER=$(node -p "require('../../package.json').version")
          fi
          # Version format: MAJOR.MINOR.BUILD (e.g. "0.0.51")
          VERSION_NAME="${BASE_VER}.${GITHUB_RUN_NUMBER}"
          echo "Using versionName: $VERSION_NAME"
          sed -i "s/versionName .*/versionName \"${VERSION_NAME}\"/" build.gradle

          echo "Final build.gradle:"
          grep "versionCode" build.gradle
          grep "versionName" build.gradle

      - name: Build Android Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --no-build-cache --stacktrace

      - name: Sign AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          jarsigner \
            -keystore app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"

      - name: Decode Google Play Service Account JSON
        if: inputs.skip-upload == false
        id: decode_service_account
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > $RUNNER_TEMP/service-account.json
          echo "json-file=$RUNNER_TEMP/service-account.json" >> $GITHUB_OUTPUT

      # A release must never go out with blank notes, so empty input falls back to the
      # generic text (kept in sync with DEFAULT_RELEASE_NOTES in src/lib/release-notes.ts).
      # Google Play also caps notes at 500 characters per locale and rejects the whole
      # release if they are longer, so truncate instead of failing the deploy.
      - name: Prepare Play Store release notes
        if: inputs.skip-upload == false
        id: whatsnew
        env:
          RELEASE_NOTES: ${{ inputs.release-notes }}
          RELEASE_NOTES_LOCALE: ${{ inputs.release-notes-locale }}
        run: |
          set -euo pipefail
          export WHATS_NEW_DIR="$RUNNER_TEMP/whatsnew"
          mkdir -p "$WHATS_NEW_DIR"
          node -e '
            const fs = require("fs");
            const limit = 500;
            const fallback = "Bug fixes and performance improvements.";
            const locale = process.env.RELEASE_NOTES_LOCALE || "en-US";
            let notes = (process.env.RELEASE_NOTES || "").trim();
            if (!notes) {
              notes = fallback;
              console.log("No release notes provided — using the default text.");
            }
            if ([...notes].length > limit) {
              notes = [...notes].slice(0, limit - 1).join("") + "…";
              console.log(`Release notes exceeded ${limit} characters — truncated.`);
            }
            fs.writeFileSync(`${process.env.WHATS_NEW_DIR}/whatsnew-${locale}`, notes);
            console.log(`Wrote whatsnew-${locale} (${[...notes].length} chars): ${notes}`);
          '
          echo "whats-new-dir=$WHATS_NEW_DIR" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload to Google Play Console
        if: inputs.skip-upload == false
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.decode_service_account.outputs.json-file }}
          packageName: ${{ inputs.package-name }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play-track }}
          status: completed
          whatsNewDirectory: ${{ steps.whatsnew.outputs.whats-new-dir }}

      - name: Upload AAB as artifact
        if: inputs.skip-upload == true
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

  promote-android-production:
    name: Promote internal release to Production
    # The inverse of deploy-android: only runs for "Release to Production". No checkout, no
    # Gradle, no signing — it never touches the source tree or builds anything. It reads the
    # release the internal track already has (built and tested by a previous "Deploy to
    # Testing" run) and moves that exact versionCode to the production track via the Play
    # Developer API, so the AAB that reaches players is provably the one that was tested.
    if: inputs.play-track == 'production' && inputs.skip-upload == false
    runs-on: ubuntu-latest

    steps:
      - name: Decode Google Play Service Account JSON
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > $RUNNER_TEMP/service-account.json

      - name: Promote the already-tested internal release to production
        env:
          SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/service-account.json
          PACKAGE_NAME: ${{ inputs.package-name }}
          RELEASE_NOTES: ${{ inputs.release-notes }}
          RELEASE_NOTES_LOCALE: ${{ inputs.release-notes-locale }}
        run: |
          set -euo pipefail
          node - <<'EOF'
          const crypto = require('crypto');
          const fs = require('fs');

          const packageName = process.env.PACKAGE_NAME;
          const serviceAccountPath = process.env.SERVICE_ACCOUNT_PATH;
          const releaseNotes = process.env.RELEASE_NOTES;
          const releaseNotesLocale = process.env.RELEASE_NOTES_LOCALE || 'en-US';

          function base64url(input) {
            return Buffer.from(input).toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
          }

          // Play Developer API auth: a service account JWT signed with its own private key,
          // exchanged for a short-lived OAuth2 access token. No user consent screen involved
          // since the service account was already granted Release manager access by hand
          // (Play Console → Users and permissions), same as the upload-google-play action uses.
          async function getAccessToken() {
            const sa = JSON.parse(fs.readFileSync(serviceAccountPath, 'utf-8'));
            const now = Math.floor(Date.now() / 1000);
            const header = { alg: 'RS256', typ: 'JWT' };
            const claims = {
              iss: sa.client_email,
              scope: 'https://www.googleapis.com/auth/androidpublisher',
              aud: 'https://oauth2.googleapis.com/token',
              iat: now,
              exp: now + 3600,
            };
            const unsigned = `${base64url(JSON.stringify(header))}.${base64url(JSON.stringify(claims))}`;
            const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), sa.private_key);
            const jwt = `${unsigned}.${base64url(signature)}`;

            const res = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion: jwt,
              }),
            });
            const json = await res.json();
            if (!res.ok) throw new Error(`Failed to mint Play Developer API access token: ${JSON.stringify(json)}`);
            return json.access_token;
          }

          async function api(token, method, path, body) {
            const res = await fetch(`https://androidpublisher.googleapis.com/androidpublisher/v3${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: body ? JSON.stringify(body) : undefined,
            });
            const text = await res.text();
            const json = text ? JSON.parse(text) : {};
            if (!res.ok) {
              throw new Error(`${method} ${path} -> ${res.status}: ${text.slice(0, 500)}`);
            }
            return json;
          }

          // Same fallback + truncation rules as the regular deploy's "Prepare Play Store
          // release notes" step (kept in sync with DEFAULT_RELEASE_NOTES in src/lib/release-notes.ts).
          function prepareReleaseNotes() {
            const limit = 500;
            const fallback = 'Bug fixes and performance improvements.';
            let notes = (releaseNotes || '').trim();
            if (!notes) {
              notes = fallback;
              console.log('No release notes provided — using the default text.');
            }
            if ([...notes].length > limit) {
              notes = [...notes].slice(0, limit - 1).join('') + '…';
              console.log(`Release notes exceeded ${limit} characters — truncated.`);
            }
            return notes;
          }

          async function main() {
            const token = await getAccessToken();

            console.log('Creating an edit...');
            const edit = await api(token, 'POST', `/applications/${packageName}/edits`, {});
            const editId = edit.id;

            console.log('Reading the current Internal testing release...');
            const internalTrack = await api(token, 'GET', `/applications/${packageName}/edits/${editId}/tracks/internal`);
            const releases = internalTrack.releases || [];
            let release = releases.find((r) => r.status === 'completed');
            if (!release && releases.length === 1) {
              console.log(`No "completed" release on internal — using the only one present (status ${releases[0].status}).`);
              release = releases[0];
            }
            if (!release) {
              throw new Error(
                releases.length === 0
                  ? 'No release found on the Internal testing track. Run "Deploy to Testing" first.'
                  : `Internal testing track has ${releases.length} releases and none is "completed" — finish the rollout in Play Console before promoting.`,
              );
            }
            console.log(`Promoting versionCodes [${release.versionCodes.join(', ')}] from Internal testing to Production (already built and tested, not rebuilt).`);

            const notes = prepareReleaseNotes();
            await api(token, 'PUT', `/applications/${packageName}/edits/${editId}/tracks/production`, {
              track: 'production',
              releases: [
                {
                  versionCodes: release.versionCodes,
                  status: 'completed',
                  releaseNotes: [{ language: releaseNotesLocale, text: notes }],
                },
              ],
            });

            console.log('Committing the edit...');
            await api(token, 'POST', `/applications/${packageName}/edits/${editId}:commit`, {});

            console.log(`✅ Promoted versionCodes [${release.versionCodes.join(', ')}] to Production.`);
          }

          main().catch((err) => {
            console.error('❌ ' + err.message);
            process.exit(1);
          });
          EOF
