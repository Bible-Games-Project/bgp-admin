name: Supabase keep-alive

# The console's Supabase project (jolsgcmdbhpaoofjabfg) is on the free plan,
# which pauses a project after a week without activity. A paused project takes
# the whole console down until someone restores it by hand in the Supabase
# dashboard, so this runs one small query every day.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Session pooler: GitHub runners have no IPv6 and the direct host is IPv6-only.
        run: >-
          psql "postgresql://postgres.jolsgcmdbhpaoofjabfg:${SUPABASE_DB_PASSWORD}@aws-1-eu-west-3.pooler.supabase.com:5432/postgres"
          --no-psqlrc --quiet --tuples-only
          --command "select count(*) as apps from public.apps"
