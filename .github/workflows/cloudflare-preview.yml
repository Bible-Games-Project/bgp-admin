name: Cloudflare Preview

# Deploys the admin panel itself to Cloudflare Workers for preview purposes
# only, replacing Lovable's auto-publish-on-commit. Publishing the actual
# apps (iOS/Android) stays manual, triggered from BGP Admin — see deploy.yml.
on:
  push:
    branches: [main]

concurrency:
  group: cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy --config .output/server/wrangler.json
          # Pushed as a real Worker secret named GITHUB_PAT (not committed) — required
          # server-side by src/lib/*.functions.ts to call the GitHub API and trigger
          # deploys. The GitHub Actions secret itself is named GH_PAT because GitHub
          # rejects secret names starting with "GITHUB_"; only the Worker-side name
          # (what process.env.GITHUB_PAT reads) needs to match the app's code.
          # SUPABASE_SERVICE_ROLE_KEY isn't listed here: it's unused (no code
          # imports supabaseAdmin) and Lovable Cloud doesn't expose its value anyway.
          # APP_STORE_CONNECT_* and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON are the same
          # org-level secrets the deploy workflows use. The console uses them to show which
          # version App Store Connect expects before a production release
          # (src/lib/appstore.functions.ts) and to read and edit each app's store listing
          # from the Store tab (src/lib/store-listing.functions.ts). Builds are still only
          # uploaded by deploy-ios.yml and deploy-android.yml.
          secrets: |
            GITHUB_PAT
            APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_BASE64
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}