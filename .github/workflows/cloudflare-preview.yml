name: Cloudflare Preview

# Deploys the admin panel itself to Cloudflare Workers for preview purposes
# only, replacing Lovable's auto-publish-on-commit. Publishing the actual
# apps (iOS/Android) stays manual, triggered from BGP Admin — see deploy.yml.
on:
  push:
    branches: [main]

concurrency:
  group: cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # Applies any new file in supabase/migrations to the console's own Supabase
      # project before the new code goes live (a no-op when nothing is pending).
      # It goes through the session pooler because GitHub runners have no IPv6 and
      # the project's direct database host is IPv6-only. The database password
      # (SUPABASE_DB_PASSWORD) is a repo secret.
      - name: Apply database migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: >-
          npx -y supabase@2.118.0 db push --yes
          --db-url "postgresql://postgres.jolsgcmdbhpaoofjabfg:${SUPABASE_DB_PASSWORD}@aws-1-eu-west-3.pooler.supabase.com:5432/postgres"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy --config .output/server/wrangler.json
          # Pushed as a real Worker secret named GITHUB_PAT (not committed) — required
          # server-side by src/lib/*.functions.ts to call the GitHub API and trigger
          # deploys. The GitHub Actions secret itself is named GH_PAT because GitHub
          # rejects secret names starting with "GITHUB_"; only the Worker-side name
          # (what process.env.GITHUB_PAT reads) needs to match the app's code.
          # SUPABASE_SERVICE_ROLE_KEY isn't listed here: it's unused (no code
          # imports supabaseAdmin), and server functions query Supabase as the
          # signed-in user so RLS applies.
          # APP_STORE_CONNECT_* and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON are the same
          # org-level secrets the deploy workflows use. The console uses them to show which
          # version App Store Connect expects before a production release
          # (src/lib/appstore.functions.ts) and to read and edit each app's store listing
          # from the Store tab (src/lib/store-listing.functions.ts). Builds are still only
          # uploaded by deploy-ios.yml and deploy-android.yml.
          # The Revenue page reads the stores' sales reports (src/lib/income.server.ts):
          # APP_STORE_CONNECT_FINANCE_KEY_* is a second App Store Connect key with the
          # Finance role (the deploy key above can't read sales), APP_STORE_VENDOR_NUMBER
          # names the seller account, and GOOGLE_PLAY_REPORTS_BUCKET is the Cloud Storage
          # bucket Play Console keeps the financial reports in. These four are repo secrets.
          secrets: |
            GITHUB_PAT
            APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_BASE64
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
            APP_STORE_CONNECT_FINANCE_KEY_ID
            APP_STORE_CONNECT_FINANCE_KEY_BASE64
            APP_STORE_VENDOR_NUMBER
            GOOGLE_PLAY_REPORTS_BUCKET
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          APP_STORE_CONNECT_FINANCE_KEY_ID: ${{ secrets.APP_STORE_CONNECT_FINANCE_KEY_ID }}
          APP_STORE_CONNECT_FINANCE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_FINANCE_KEY_BASE64 }}
          APP_STORE_VENDOR_NUMBER: ${{ secrets.APP_STORE_VENDOR_NUMBER }}
          GOOGLE_PLAY_REPORTS_BUCKET: ${{ secrets.GOOGLE_PLAY_REPORTS_BUCKET }}